<!doctype html>
<meta charset="utf-8">
<title>Plan, promote, sell</title>
<meta name="description" content="Event Schedule: a 28-second motion showreel, in a dark and a light cut.">
<script>
// ?theme=light|dark picks the cut. Without it the preview follows the OS, but a render
// (?render=1) always names its theme, so the same command renders the same film anywhere.
(() => {
  const q = new URLSearchParams(location.search);
  const light = q.has('theme') ? q.get('theme') === 'light' : !q.has('render') && matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
})();
</script>
<link rel="stylesheet" href="film.css">

<div id="app">
  <div id="frame"><div id="stage">
    <div id="world">
      <div id="wall"><div id="wallbg"></div><canvas id="wallfx" width="2320" height="1090"></canvas><div id="wallo"></div></div>
      <div id="floor"><div class="pl"></div><canvas id="floorfx" width="2720" height="1100"></canvas><div id="flooro"></div></div>
      <div id="props"></div>
    </div>
    <canvas id="fx" class="full" width="1920" height="1080"></canvas>
    <div id="hud" class="layer"></div>
    <canvas id="grain" class="full" width="960" height="540"></canvas>
    <div id="vig"></div>
    <div id="flash"></div>
  </div></div>

  <div id="bar" role="group" aria-label="Player controls">
    <button id="play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"></svg></button>
    <input id="scrub" type="range" min="0" max="28" step="0.001" value="0" aria-label="Seek">
    <span id="tc">00.0 / 28.0</span>
    <button id="loop" aria-label="Loop" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
    <button id="theme" aria-label="Switch to the other cut (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
</div>

<script>
// The film's length in seconds. render.mjs reads this line.
const DUR = 28;
</script>
