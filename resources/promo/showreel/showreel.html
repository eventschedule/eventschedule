<title>Booked Solid</title>
<meta name="description" content="Event Schedule: a 30-second motion showreel.">
<style>
@font-face{font-family:"InterV";src:url("InterVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#0a0a0f;--ink:#f5f7fb;--ink2:rgba(245,247,251,.62);--ink3:rgba(245,247,251,.38);
  --blue:#4E81FA;--sky:#0EA5E9;--cyan:#22D3EE;--logo-blue:#048EEB;--logo-slate:#4C5564;
  --grad:linear-gradient(135deg,#4E81FA 0%,#0EA5E9 50%,#22D3EE 100%);
  --font:"InterV",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Arial Hebrew","Noto Sans Hebrew","Geeza Pro","Noto Sans Arabic",sans-serif;
  --page:#050508;--chrome:rgba(255,255,255,.06);--chrome-line:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
#frame{position:relative;width:min(100%,calc((100dvh - 110px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg);contain:strict}
body.render #app{padding:0;gap:0}
body.render #frame{width:100vw;height:100vh;border-radius:0;box-shadow:none}
body.render #bar{display:none}

/* player chrome */
#bar{width:min(100%,calc((100dvh - 110px)*16/9));display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
#bar button{appearance:none;border:0;background:var(--chrome);color:var(--ink);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#bar button[aria-pressed="true"]{color:var(--cyan)}
#bar svg{width:18px;height:18px}
#scrub{flex:1;min-width:0;accent-color:var(--blue);height:4px}
#tc{flex:none;min-width:92px;text-align:right}
@media (max-width:520px){#tc{min-width:0;font-size:12px}#loop{display:none}}

/* stage primitives */
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.a{position:absolute;left:0;top:0}
canvas.full{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#grain{mix-blend-mode:overlay;opacity:.07}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 58%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#dbe8ff;opacity:0;pointer-events:none}
.gtext{background:linear-gradient(100deg,#4E81FA 0%,#0EA5E9 30%,#22D3EE 50%,#0EA5E9 70%,#4E81FA 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tight{letter-spacing:-.04em}
.nowrap{white-space:nowrap}

/* calendar */
#cal{perspective:2200px;perspective-origin:960px 540px}
#calcam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform-style:preserve-3d}
.cell{position:absolute;left:0;top:0;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.cell .num{position:absolute;left:12px;top:9px;font-size:15px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .num.dim{color:var(--ink3)}
.cell .fill{position:absolute;inset:0;opacity:0}
.cell .flash{position:absolute;inset:0;background:#fff;opacity:0}
.cell .lab{position:absolute;left:12px;bottom:10px;right:10px;font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:clip}
.chip{position:absolute;left:8px;right:8px;bottom:8px;height:74px;border-radius:9px;padding:8px 10px 8px 13px;background:rgba(24,32,52,.96);box-shadow:inset 4px 0 0 var(--c),inset 0 0 0 1px rgba(255,255,255,.08);opacity:0}
.chip b{display:block;font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
.chip i{display:block;font-style:normal;font-size:11px;color:var(--ink2);margin-top:3px;white-space:nowrap}
.chip .tk{position:absolute;right:8px;bottom:8px;height:22px;min-width:62px;padding:0 8px;border-radius:6px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chip .tk span{display:block;white-space:nowrap}
#month{font-size:40px;font-weight:800;letter-spacing:-.02em}
.whd{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--ink3);text-align:center;width:196px}
#seed{width:12px;height:12px;border-radius:50%;background:#9ec0ff;box-shadow:0 0 18px 6px rgba(78,129,250,.9),0 0 60px 20px rgba(78,129,250,.35)}
.word{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;text-align:center;filter:drop-shadow(0 14px 34px rgba(0,0,0,.45))}

/* headline */
.hl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.hl .l1wrap{position:absolute;left:0;width:1920px;top:318px;height:140px;overflow:hidden;text-align:center}
.hl .l1{font-size:112px;font-weight:800;line-height:140px;color:rgba(245,247,251,.92)}
.hl .l2{position:absolute;left:0;top:0;font-size:250px;font-weight:900;line-height:1;white-space:nowrap}

/* poster + form */
.poster{position:absolute;left:0;top:0;width:420px;height:590px;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#0b1a3a 0%,#123e8c 58%,#0EA5E9 130%);box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
.poster .sun{position:absolute;right:-70px;top:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FDE68A,#F59E0B 60%,#D97706)}
.poster .p1{position:absolute;left:30px;top:44px;font-size:30px;font-weight:800;letter-spacing:.22em}
.poster .p2{position:absolute;left:22px;top:92px;font-size:150px;font-weight:900;letter-spacing:-.05em;line-height:1}
.poster .p3{position:absolute;left:30px;top:420px;font-size:30px;font-weight:800}
.poster .p4{position:absolute;left:30px;top:470px;font-size:24px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.06em}
.poster .bars{position:absolute;left:30px;right:30px;bottom:34px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.poster .laser{position:absolute;left:-20px;right:-20px;height:4px;background:#b9f6ff;box-shadow:0 0 16px 4px rgba(34,211,238,.9),0 0 60px 18px rgba(34,211,238,.35)}
.poster .scanned{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,rgba(34,211,238,0),rgba(34,211,238,.12))}
.poster .box{position:absolute;border-radius:10px;box-shadow:0 0 0 2px #22D3EE,0 0 24px rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.form{position:absolute;left:0;top:0;width:540px;height:500px;border-radius:26px;padding:34px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(255,255,255,.09),0 40px 90px rgba(0,0,0,.45)}
.form h3{margin:0 0 22px;font-size:28px;font-weight:800;display:flex;align-items:center;gap:12px}
.form h3 em{font-style:normal;font-size:14px;font-weight:700;color:#0b1220;background:var(--grad);padding:5px 10px;border-radius:99px}
.fld{margin-bottom:18px}
.fld label{display:block;font-size:15px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.fld .in{height:58px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:0 18px;display:flex;align-items:center;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden}
.form .pub{position:absolute;left:34px;right:34px;bottom:30px;height:56px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.fly{position:absolute;left:0;top:0;padding:10px 16px;border-radius:12px;background:rgba(8,40,60,.9);box-shadow:0 0 0 2px #22D3EE,0 12px 30px rgba(0,0,0,.4);font-size:20px;font-weight:700;white-space:nowrap}
.cap{position:absolute;left:0;width:1920px;text-align:center}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:.28em;color:var(--cyan)}
.caph{font-size:68px;font-weight:800;letter-spacing:-.03em}
.pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:99px;background:rgba(16,20,32,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 16px 40px rgba(0,0,0,.4);font-size:24px;font-weight:700;white-space:nowrap}
.pill .sq{width:16px;height:16px;border-radius:5px}
.url{font-size:30px;font-weight:600;padding:16px 28px}
.url .caret{display:inline-block;width:3px;height:30px;background:var(--cyan);margin-left:3px;vertical-align:-5px}

/* tickets */
#m5{perspective:2400px;perspective-origin:720px 540px}
#tk{position:absolute;left:0;top:0;transform-style:preserve-3d}
#tk .face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#tk .front{background:linear-gradient(160deg,#4E81FA 0%,#0EA5E9 60%,#22D3EE 120%)}
#tk .back{background:#f6f8fc;color:#0b1220;transform:rotateY(180deg)}
.notch{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--bg);top:486px}
.perf{position:absolute;left:34px;right:34px;top:506px;height:0;border-top:3px dotted rgba(255,255,255,.55)}
.back .perf{border-top-color:rgba(11,18,32,.25)}
.tf{position:absolute;left:40px;right:40px}
.qrm{position:absolute;left:0;top:0;width:14.6px;height:14.6px;background:#0b1220;border-radius:2px}
#chk{position:absolute;left:0;top:0;width:180px;height:180px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 10px rgba(34,197,94,.25),0 20px 50px rgba(34,197,94,.45);display:grid;place-items:center}
.odo{position:absolute;left:0;top:0}
.odo .lbl{font-size:26px;font-weight:700;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase;margin-bottom:6px}
.odo .num{display:flex;font-size:150px;font-weight:800;line-height:150px;height:150px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.odo .col{height:150px;overflow:hidden;width:.62em;position:relative}
.odo .strip{position:absolute;left:0;top:0;width:100%;text-align:center}
.odo .strip div{height:150px}
.odo .sep{width:.28em;text-align:center}
.bigline{position:absolute;left:0;top:0;white-space:nowrap;font-size:170px;font-weight:900;line-height:1}

/* features */
#m6{overflow:hidden}
#wall{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.tile{position:absolute;left:0;top:0;width:384px;height:216px;border-radius:12px;overflow:hidden;background:#111827;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 40px rgba(0,0,0,.35)}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
#featTile{position:absolute;left:-192px;top:-108px;width:384px;height:216px;overflow:hidden;border-radius:0}
#feat{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(.2);overflow:hidden}
#feat .fbg{position:absolute;inset:0}
.fitem{position:absolute;inset:0}
.fword{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:.95}
.fglyph{position:absolute;width:460px;height:460px}
.hud{position:absolute;font-size:22px;font-weight:700;letter-spacing:.24em;font-variant-numeric:tabular-nums}
#fprog{position:absolute;left:96px;right:96px;bottom:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#fprog i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 0;background:#fff}
#m6dark{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 50%,rgba(5,5,8,.92) 0%,rgba(5,5,8,.8) 55%,rgba(5,5,8,.55) 100%)}
#m6text{position:absolute;inset:0}
.ch{display:inline-block;white-space:pre}

/* resolve */
#mark{position:absolute;left:0;top:0;width:140px;height:140px;transform-origin:0 0}
#mark svg{position:absolute;left:0;top:0;width:140px;height:140px;overflow:visible}
#word{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;letter-spacing:.028em}
#cta{position:absolute;left:0;top:0;padding:22px 44px;border-radius:18px;background:var(--grad);font-size:38px;font-weight:800;color:#fff;overflow:hidden;box-shadow:0 20px 60px rgba(14,165,233,.35)}
#cta .shine{position:absolute;top:-20%;bottom:-20%;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
#site{position:absolute;left:0;top:0;font-size:36px;font-weight:600;color:var(--ink2);letter-spacing:.01em}
</style>

<div id="app">
  <div id="frame"><div id="stage">
    <canvas id="bg" class="full" width="1920" height="1080"></canvas>

    <div id="cal" class="layer">
      <div id="calcam"></div>
      <div id="words" class="layer"></div>
    </div>

    <div id="m4" class="layer"></div>
    <div id="m3" class="layer"></div>
    <div id="m5" class="layer"></div>
    <div id="m6" class="layer">
      <div id="wall"></div>
      <div id="m6dark"></div>
      <div id="m6text"></div>
    </div>
    <div id="m7" class="layer"></div>

    <canvas id="fg" class="full" width="1920" height="1080"></canvas>
    <canvas id="grain" class="full" width="960" height="540"></canvas>
    <div id="vig"></div>
    <div id="flash"></div>
  </div></div>

  <div id="bar" role="group" aria-label="Player controls">
    <button id="play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"></svg></button>
    <input id="scrub" type="range" min="0" max="30" step="0.001" value="0" aria-label="Seek">
    <span id="tc">00.0 / 30.0</span>
    <button id="loop" aria-label="Loop" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1920, H = 1080, DUR = 30;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp((t - a) / (b - a));
const mix = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = s => ((ax * s + bx) * s + cx) * s, sy = s => ((ay * s + by) * s + cy) * s;
  const dx = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const e = sx(s) - x, d = dx(s); if (Math.abs(e) < 1e-6 || !d) break; s -= e / d; }
    return sy(clamp(s));
  };
}
const E = {
  lin: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  rise: bezier(.22, 1, .36, 1),
  snap: bezier(.7, 0, .15, 1),
};
// Damped spring from 0 to 1; dt in seconds since release.
function spring(dt, freq = 1.6, damp = .5) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * freq, z = damp, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hash = (n) => { const r = rng(n * 9973 + 17); return r(); };

/* ---------- dom ---------- */
const $ = s => document.querySelector(s);
function mk(tag, cls, parent, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function html(parent, markup) { const d = document.createElement('div'); d.innerHTML = markup.trim(); const e = d.firstElementChild; parent.appendChild(e); return e; }
const vis = (e, on) => { const v = on ? '' : 'none'; if (e.style.display !== v) e.style.display = v; };
// Center-anchored placement.
function place(e, x, y, s = 1, r = 0, o = 1, extra = '') {
  e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})${extra} translate(-50%,-50%)`;
  e.style.opacity = o;
}
const stage = $('#stage');
let stageScale = 1;
function rectIn(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: (r.left - s.left) / stageScale, y: (r.top - s.top) / stageScale, w: r.width / stageScale, h: r.height / stageScale,
    get cx() { return this.x + this.w / 2; }, get cy() { return this.y + this.h / 2; } };
}

/* ---------- slash geometry (the logo's cut) ---------- */
const UX = .6 / Math.hypot(.6, 1), UY = -1 / Math.hypot(.6, 1); // up-right along the cut
const NX = -UY, NY = UX;                                         // perpendicular, down-right
const P = (x, y) => `${x.toFixed(1)}px ${y.toFixed(1)}px`;
function halfClip(sign, cx = 960, cy = 540) {
  const L = 4000, a = [cx + UX * L, cy + UY * L], b = [cx - UX * L, cy - UY * L];
  return `polygon(${P(...a)},${P(...b)},${P(b[0] + sign * NX * L, b[1] + sign * NY * L)},${P(a[0] + sign * NX * L, a[1] + sign * NY * L)})`;
}
function bandClip(w, cx = 960, cy = 540) {
  const L = 4000;
  return `polygon(${P(cx + UX * L - NX * w, cy + UY * L - NY * w)},${P(cx - UX * L - NX * w, cy - UY * L - NY * w)},${P(cx - UX * L + NX * w, cy - UY * L + NY * w)},${P(cx + UX * L + NX * w, cy + UY * L + NY * w)})`;
}

/* ---------- canvases ---------- */
const bgc = $('#bg').getContext('2d'), fgc = $('#fg').getContext('2d'), grc = $('#grain').getContext('2d');
const grainFrames = (() => {
  const out = [], r = rng(42);
  for (let f = 0; f < 4; f++) {
    const id = grc.createImageData(960, 540), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    out.push(id);
  }
  return out;
})();
const gridCanvas = (() => {
  const c = document.createElement('canvas'); c.width = W + 120; c.height = H + 120;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,255,255,1)'; g.lineWidth = 1;
  for (let x = .5; x < c.width; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); }
  for (let y = .5; y < c.height; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(c.width / 2, c.height / 2, 0, c.width / 2, c.height / 2, c.width * .5);
  m.addColorStop(0, 'rgba(0,0,0,.09)'); m.addColorStop(.6, 'rgba(0,0,0,.05)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, c.width, c.height);
  return c;
})();

// Atmosphere intensity keyframes: [t, aurora, grid, rays]
const BGK = [

  for (const [t0, R, a] of [[.5, 150, .7], [1.0, 200, .8], [1.5, 1100, .9]]) {

const ready = (async () => {

const playBtn = $('#play'), playIco = $('#playIco'), scrub = $('#scrub'), tc = $('#tc'), loopBtn = $('#loop');
const ICON_PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setPlaying(p) {
