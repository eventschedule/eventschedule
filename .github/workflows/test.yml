name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-scripts --no-progress

      # TODO: Uncomment this when we have a way to ignore low severity vulnerabilities
      #- name: Composer security audit
      #  run: composer audit

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Fail only on real vulnerabilities. When npm's advisory API is broken or
      # unreachable the CLI also exits 1, but its --json output is an error object
      # with no auditReportVersion key - warn and move on in that case.
      - name: npm security audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=critical --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          set -e
          if jq -e 'has("auditReportVersion")' "$RUNNER_TEMP/npm-audit.json" > /dev/null; then
            jq '.metadata.vulnerabilities' "$RUNNER_TEMP/npm-audit.json"
            if [ "$status" -ne 0 ]; then
              echo "::error::npm audit found vulnerabilities at or above the critical level"
              jq '.vulnerabilities' "$RUNNER_TEMP/npm-audit.json"
            fi
            exit $status
          fi
          echo "::warning::npm audit endpoint unavailable - skipping audit"
          jq -r '.message // .' "$RUNNER_TEMP/npm-audit.json" 2>/dev/null || cat "$RUNNER_TEMP/npm-audit.json"

  feature-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: eventschedule_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          # Full history: sitemap:lastmod dates each page from the last commit that touched
          # its view. On the default shallow clone every path resolves to the one fetched
          # commit, so the regenerated manifest would differ from the committed one and the
          # check below would fail on every push regardless of whether anything drifted.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, mysql
          ini-values: memory_limit=1G
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-scripts --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure env for tests
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=eventschedule_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          sed -i 's/IS_HOSTED=.*/IS_HOSTED=true/' .env
          echo "APP_TESTING=true" >> .env
          echo "IS_NEXUS=true" >> .env

      - name: Generate application key
        run: php artisan key:generate

      # config/sitemap_lastmod.php is generated, and a marketing page whose <lastmod> is older
      # than its own content trains Google to ignore the signal. Regenerating and diffing is
      # the mechanical version of CLAUDE.md's "run sitemap:lastmod before a release" rule, so
      # nobody has to remember it on deploy day.
      - name: Sitemap lastmod manifest is current
        run: |
          php artisan sitemap:lastmod
          git diff --exit-code config/sitemap_lastmod.php

      - name: Run Feature & Unit tests
        run: php artisan test

      # The suite above runs token-less, so it never reaches the half of
      # tests/TestDatabase.php that connects, creates and drops schemas. This does.
      # CI's MySQL user is root, so it can create under the prefix without a grant;
      # TestDatabaseSchemaTest pins what the prune is allowed to match.
      - name: Verify the per-session database path
        run: TEST_DB_TOKEN=ci1 TEST_DB_PRUNE_DAYS=0 php artisan test --filter=TestDatabaseSchemaTest

  dusk:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, mysql
          tools: composer, npm

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-scripts --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure MySQL database
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          sed -i 's/APP_URL=.*/APP_URL=http:\/\/127.0.0.1:8000\nAPP_TESTING=true/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=false/' .env
          # Dusk reuses one browser across every test method in a class, so a session that
          # outlives a test can poison the next one's signup. DatabaseTruncation wipes the
          # sessions and cache tables, but only when they ARE the store - .env.example ships
          # the file drivers. Match the checked-in .env.dusk.local so CI behaves like local.
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=database/' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=database/' .env
          echo "" >> .env && echo "IS_NEXUS=true" >> .env
          echo "DEBUGBAR_ENABLED=false" >> .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up Dusk environment
        run: |
          php artisan dusk:install
          php artisan dusk:chrome-driver --detect
          php artisan storage:link
          php artisan migrate --env=testing --force

      - name: Install npm dependencies and build assets
        run: |
          npm ci --ignore-scripts
          npm run build
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      # --no-reload is what makes PHP_CLI_SERVER_WORKERS take effect (ServeCommand disables
      # workers whenever the env watcher is on), and it also stops the watcher restarting the
      # server when `php artisan dusk` swaps .env. A single-worker server serializes every
      # request, which is what lets one slow POST outlive the test that fired it.
      - name: Start Laravel server in background
        run: php artisan serve --no-reload > /dev/null 2>&1 &
        env:
          PHP_CLI_SERVER_WORKERS: 4

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/up | grep -q '200'; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 1
          done

      - name: Run Laravel Dusk tests
        run: |
          cp .env .env.dusk.local
          for test in tests/Browser/*Test.php; do
            # dusk:install scaffolds a placeholder ExampleTest.php (asserts "Laravel"); skip it.
            if [ "$(basename "$test")" = "ExampleTest.php" ]; then
              echo "Skipping scaffold $test"
              continue
            fi
            echo "Running $test"
            php artisan dusk "$test"
            php artisan cache:clear
          done
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8000
  
      - name: Upload Dusk Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: |
            tests/Browser/screenshots
            tests/Browser/console

      - name: Upload Query Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: query-log
          path: storage/logs/queries.log
          if-no-files-found: ignore

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: storage/logs/laravel.log
          if-no-files-found: ignore