; PHP-FPM settings for the hosted web container, loaded by its run command:
;   heroku-php-apache2 -F deploy/php-fpm.conf public/
;
; PHP2Shell (CVE-2026-109618, CVE-2026-109619) mitigations until DigitalOcean's buildpack offers
; PHP 8.4.27 / 8.5.12. They must be set here: .user.ini and ini_set() apply too late in the
; request to protect the parsing these flaws live in. php_admin_* also stops the app overriding
; them. Remove both lines once the patched PHP is deployed.
;
; memory_limit -1 means a runaway request is stopped by the container's memory limit (a restart)
; rather than by PHP's out-of-memory bailout, which is the path CVE-2026-109618 corrupts.
; ImageUtils::canDecodePixels() keeps its own ceiling either way.
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[memory_limit] = -1
